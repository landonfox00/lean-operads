name: Documentation

# Builds the API documentation with doc-gen4 and publishes it on GitHub Pages,
# at https://<owner>.github.io/lean-operads/docs. Pages must be enabled with
# "GitHub Actions" as its source (Settings > Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    name: Build and publish documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        uses: leanprover/lean-action@v1

      - name: Documentation
        # `main` as of 2026-11-03; the action has no release tags.
        uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c
        with:
          build-page: false
