name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Installs the toolchain named in `lean-toolchain`, fetches the Mathlib
      # olean cache, and runs `lake build`, failing on any warning.
      - name: Build
        uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail --log-level=warning"

      # Mathlib's environment linters (docstrings, simp normal forms, unused
      # arguments, naming), through Batteries' `runLinter`.
      - name: Lint
        run: lake exe runLinter Operad

      - name: Line length
        run: |
          python3 - <<'PY'
          import pathlib, sys
          bad = [f"{p}:{i}: {len(l)} characters"
                 for p in sorted(pathlib.Path("Operad").glob("*.lean")) + [pathlib.Path("Operad.lean")]
                 for i, l in enumerate(p.read_text(encoding="utf-8").split("\n"), 1) if len(l) > 100]
          print("\n".join(bad) or "All lines within 100 characters.")
          sys.exit(1 if bad else 0)
          PY

      - name: No sorry or admit in library sources
        run: |
          if grep -rnE '\b(sorry|admit|native_decide)\b' Operad/ Operad.lean; then
            echo "::error::library sources contain sorry, admit, or native_decide"
            exit 1
          fi
          echo "Library sources are clean."

      # The build above does not compile Audit.lean: it is deliberately outside the
      # `Operad` lean_lib so that a failing audit is reported as its own step.
      - name: Axiom audit
        run: |
          set -o pipefail
          lake env lean Audit.lean 2>&1 | tee audit.txt
          if grep -q 'sorryAx' audit.txt; then
            echo "::error::a declaration depends on sorryAx"
            exit 1
          fi
          echo "No declaration depends on sorryAx."

      - name: Summary
        if: always()
        run: |
          {
            echo "### lean-operads"
            echo
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Lines | $(cat Operad/*.lean Operad.lean | wc -l) |"
            echo "| Declarations | $(grep -chE '^(@\[[^]]*\] )?(private |protected |noncomputable )*(def|lemma|theorem|instance|structure|class|abbrev)' Operad/*.lean | paste -sd+ | bc) |"
            echo "| Toolchain | \`$(cat lean-toolchain)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
