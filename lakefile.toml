name = "Operad"
defaultTargets = ["Operad"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

# Pinned to the Mathlib already fetched and built on this machine at
# ~/Documents/Lean/mathematics_in_lean (same toolchain, same revision), which
# `.lake/packages` is a directory junction to. Nothing is downloaded.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.30.0"

[[lean_lib]]
name = "Operad"
